[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deal-aggregator"
version = "0.1.0"
description = "Shared deal-finding components and category-specific catalogs"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20,<0.23",
    "httpx>=0.27,<0.29",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5.0,<7",
    "click>=8.1,<9",
    "rich>=13.0,<15",
    "fastapi>=0.110,<0.136",
    "starlette>=0.46,<1.0",
    "uvicorn>=0.29,<0.43",
    "jinja2>=3.1,<4",
    "libsql>=0.1,<0.2",
    "python-multipart>=0.0.7,<0.1",
    "PyJWT>=2.8,<3",
]

[project.optional-dependencies]
scraping = ["playwright>=1.40"]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "playwright>=1.40",
]

[project.scripts]
snow-deals = "snow_deals.cli:cli"
snow-deals-agg = "aggregator.cli:cli"

[tool.setuptools.packages.find]
where = ["common", "catalogs/fresh-powder/src"]
include = ["deal_common*", "aggregator*", "snow_deals*"]

[tool.setuptools.package-data]
"aggregator" = ["comparison_catalog.json"]
"aggregator.web" = ["templates/*.html", "templates/partials/*.html", "static/*.css", "static/*.js", "static/img/*"]

[tool.pytest.ini_options]
testpaths = ["common/tests", "catalogs/fresh-powder/tests"]
pythonpath = ["common", "catalogs/fresh-powder/src"]
