[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snow-deals"
version = "0.1.0"
description = "CLI tool that scrapes e-commerce listings and ranks items by discount percentage"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "click>=8.1",
    "rich>=13.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "libsql>=0.1",
    "playwright>=1.40",
    "python-multipart>=0.0.7",
    "PyJWT>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
snow-deals = "snow_deals.cli:cli"

[tool.setuptools.packages.find]
include = ["snow_deals*"]
