[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snow-deals"
version = "0.1.0"
description = "CLI tool that scrapes e-commerce listings and ranks items by discount percentage"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20,<0.23",
    "httpx>=0.27,<0.29",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5.0,<7",
    "click>=8.1,<9",
    "rich>=13.0,<15",
    "fastapi>=0.110,<0.136",
    "starlette>=0.46,<1.0",
    "uvicorn>=0.29,<0.43",
    "jinja2>=3.1,<4",
    "libsql>=0.1,<0.2",
    "python-multipart>=0.0.7,<0.1",
    "PyJWT>=2.8,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
snow-deals = "snow_deals.cli:cli"

[tool.setuptools.packages.find]
include = ["snow_deals*"]
