name: Cycling and tools checks

on:
  pull_request:
    paths:
      - 'common/**'
      - 'catalogs/cycling/**'
      - 'catalogs/tools/**'
      - 'scripts/check.py'
      - 'scripts/*.py'
      - 'pyproject.toml'
      - '.github/workflows/catalog-*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: python scripts/check.py -q
      - run: ruff check common/deal_common/catalog catalogs/cycling/src catalogs/tools/src scripts/package_catalog.py scripts/restore_catalog.py scripts/verify_catalog_live.py scripts/audit_catalog.py scripts/audit_merchants.py scripts/benchmark.py common/deal_common/benchmark.py
      - run: node --check common/deal_common/catalog/static/catalog.js
