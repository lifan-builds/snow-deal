name: Scrape Deals

on:
  schedule:
    # Run once a day at midnight to stay within GitHub Actions free tier limits (2000 min/mo)
    - cron: "0 0 * * *"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e .
          cd aggregator && pip install -e .

      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Run scraper
        run: snow-deals-agg -v refresh --max-pages 25

      - name: Fetch reviews
        run: snow-deals-agg fetch-reviews --delay 1.0 --max-reviews 200 || echo "fetch-reviews failed, skipping"

      - name: Upload deals.db to public data repo
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          # Upload to the public data repo so Render can download without auth
          # Requires a PAT (DATA_REPO_TOKEN) with repo scope for the target repo
          gh release delete latest-data --yes --repo lifan-builds/snow-deal-data 2>/dev/null || true
          gh release create latest-data \
            aggregator/deals.db \
            --repo lifan-builds/snow-deal-data \
            --title "Latest Deals Data" \
            --notes "Auto-generated by scrape workflow at $(date -u '+%Y-%m-%d %H:%M UTC')" \
            --latest=false

      - name: Trigger Vercel deploy
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "Triggering Vercel deploy hook..."
            curl -fsS "$VERCEL_DEPLOY_HOOK_URL"
            exit 0
          fi
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Vercel deploy hook/token secrets not set; skipping Vercel redeploy."
            exit 0
          fi
          echo "Triggering Vercel production redeploy via CLI..."
          npm install -g vercel@latest
          vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          vercel deploy --prod --force --yes --token "$VERCEL_TOKEN"

      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL not set; skipping Render redeploy."
            exit 0
          fi
          echo "Triggering Render deploy hook..."
          curl -fsS "$RENDER_DEPLOY_HOOK_URL"
