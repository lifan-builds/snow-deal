name: Scrape Deals

on:
  schedule:
    # Daily; avoid the busiest top-of-hour queue.
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      refresh_reviews:
        description: Refresh expert reviews as well as prices
        type: boolean
        default: false
      stores:
        description: Optional comma-separated retailer names to refresh only those sources
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: freshpowder-data-publish
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e . -e './aggregator[dev]'
      - name: Verify parsers and data contracts
        env:
          DATABASE_PATH: /tmp/freshpowder-tests.db
          AUTH_DB_PATH: /tmp/freshpowder-test-auth.db
        run: python -m pytest aggregator/tests -q
      - name: Restore previous snapshot and price history
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download latest-data --repo lifan-builds/snow-deal-data --pattern deals.db --dir aggregator
      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps
      - name: Run scraper
        env:
          REFRESH_STORES: ${{ inputs.stores }}
        run: |
          args=(--delay 2 --max-pages 100 --report scrape-report.json)
          if [ -n "$REFRESH_STORES" ]; then
            IFS=',' read -ra selected <<< "$REFRESH_STORES"
            args+=(--min-stores "${#selected[@]}")
            for store in "${selected[@]}"; do args+=(--store "$store"); done
          else
            args+=(--min-stores 20)
          fi
          snow-deals-agg refresh "${args[@]}"
      - name: Refresh expert reviews weekly
        if: ${{ inputs.refresh_reviews || github.event.schedule == '17 5 * * *' }}
        run: |
          if [ "${{ inputs.refresh_reviews }}" = "true" ] || [ "$(date -u +%u)" = "7" ]; then
            snow-deals-agg fetch-reviews --delay 2 --max-reviews 200
          fi
      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-quality
          path: scrape-report.json
          if-no-files-found: ignore
      - name: Publish validated snapshot
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          gh release upload latest-data aggregator/deals.db --clobber --repo lifan-builds/snow-deal-data
          gh release edit latest-data --repo lifan-builds/snow-deal-data --notes "Validated snapshot from run $GITHUB_RUN_ID"
      - name: Deploy fresh data to Vercel
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK_URL is required."
            exit 1
          fi
          curl --fail --silent --show-error --retry 2 --max-time 30 --request POST "$VERCEL_DEPLOY_HOOK_URL" --output /dev/null
      - name: Verify production snapshot
        run: python scripts/verify_live_snapshot.py scrape-report.json
